<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X10 · AI Essentials for Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#20396F;--deep:#14264F;--steel:#5B7991;--red:#ED1C24;--ink:#14213D;--mute:#5A6478;--bg:#EEF2F7;--tile:#E2E8F0;--card:#F8FAFD;--line:#D3DBE6;--ok:#1E8E5A;--okbg:#E6F4EC;--nobg:#FDECEC;
--ar:'Almarai','Geeza Pro',Tahoma,sans-serif;--en:'Lato','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--en);line-height:1.65}
.ltr{direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff}
header .in{display:flex;align-items:center;gap:14px;height:58px;padding:0 18px;max-width:1240px;margin:0 auto}
header img{height:28px;display:block}
header .ct{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pg{font-size:13px;opacity:.85;white-space:nowrap}
header .bar{position:absolute;inset-inline:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
header .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
.hb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.menu{display:none}
.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;max-width:1240px;margin:0 auto;padding:24px 18px 60px}
aside{position:sticky;top:82px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border-radius:20px;padding:16px}
aside h4{margin:12px 6px 6px;font-size:13px;color:var(--mute);font-weight:700}
aside h4:first-child{margin-top:2px}
aside button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;background:transparent;border-radius:12px;padding:8px 10px;color:var(--ink);font-size:15px;line-height:1.5}
aside button:hover{background:var(--tile)}
aside button[aria-current="true"]{background:var(--navy);color:#fff}
aside .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;margin-top:1px;font-family:var(--en);font-weight:900}
aside .done .st{background:var(--ok);border-color:var(--ok);color:#fff}
aside button[aria-current="true"] .st{border-color:rgba(255,255,255,.6)}
main{min-width:0}
.card{background:var(--card);border-radius:24px;padding:34px 38px}
.eyebrow{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 10px;font-weight:700;font-size:13px}
.meta{color:var(--mute);font-size:14px;margin-top:6px}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.35;margin:10px 0 4px;font-weight:800}
html[lang="en"] h1{letter-spacing:-.02em;line-height:1.15}
.body p{margin:14px 0}
.body ul,.body ol{padding-inline-start:22px;margin:12px 0}
.key{background:#fff;border-inline-start:4px solid var(--red);border-radius:12px;padding:14px 18px;margin:18px 0}
.key b{display:block;color:var(--red);font-size:14px;margin-bottom:2px}
.two,.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.ok,.good{background:var(--okbg);border-radius:14px;padding:14px 16px}
.no,.bad{background:var(--nobg);border-radius:14px;padding:14px 16px}
.ok b,.no b,.good b,.bad b{display:block;font-size:14px;margin-bottom:4px}
.ok ul,.no ul{margin:0}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;position:relative;padding-inline-start:40px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:2px;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--en);font-weight:900;font-size:14px}
@media (max-width:640px){.two,.cmp{grid-template-columns:1fr}}
.sec{margin-top:26px}
.sec h3{font-size:18px;margin:0 0 10px}
.pr{background:#0F1E40;color:#E8EEFA;border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.7}
.pr span{flex:1;white-space:pre-wrap}
.pr button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.try{background:linear-gradient(150deg,var(--navy),var(--steel));color:#fff;border-radius:18px;padding:18px 20px}
.try b{display:block;font-size:14px;opacity:.85;margin-bottom:4px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;background:#fff;resize:vertical}
.saved{font-size:12px;color:var(--mute);margin-top:4px;min-height:18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--navy);color:#fff;text-decoration:none;display:inline-block}
.btn.red{background:var(--red)}.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.q{background:#fff;border-radius:16px;padding:18px 20px;margin:14px 0}
.q p{margin:0 0 10px;font-weight:700}
.q label{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;border:1px solid var(--line);margin:6px 0;cursor:pointer;font-size:15px}
.q label:hover{background:var(--bg)}
.q input{margin-top:6px;accent-color:var(--navy)}
.q label.right{background:var(--okbg);border-color:var(--ok)}
.q label.wrong{background:var(--nobg);border-color:var(--red)}
.q .why{font-size:14px;color:var(--mute);margin-top:8px;display:none}
.q.show .why{display:block}
.score{border-radius:16px;padding:16px 18px;margin-top:14px;font-weight:700}
.score.pass{background:var(--okbg);color:var(--ok)}.score.fail{background:var(--nobg);color:#B3141A}
.intro .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.intro .facts div{background:#fff;border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mute)}
.intro .facts b{display:block;font-size:17px;color:var(--ink)}
@media (max-width:640px){.intro .facts{grid-template-columns:1fr}}
.cert{background:#fff;border-radius:18px;padding:34px 30px;text-align:center;border:10px solid var(--deep);outline:2px solid var(--red);outline-offset:-18px;margin-top:18px}
.cert img{height:44px;background:var(--deep);padding:12px 18px;border-radius:12px;box-sizing:content-box}
.cert .who{font-size:34px;font-weight:800;margin:14px 0 4px;color:var(--navy);min-height:48px}
.cert .c{font-size:15px;color:var(--mute)}
.cert .cn{font-size:22px;font-weight:800;margin:8px 0}
.namein{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.namein input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px}
@media (max-width:900px){
 .layout{grid-template-columns:1fr;padding-top:14px}
 aside{display:none;position:fixed;inset:58px 0 0 0;max-height:none;border-radius:0;z-index:4}
 body.open aside{display:block}
 .menu{display:inline-block}
 .card{padding:24px 20px;border-radius:20px}
}
@media print{header,aside,.nav,.namein,.noprint{display:none!important}.layout{display:block;padding:0}.card{background:#fff;padding:0}body{background:#fff}}
.we .weq{background:#0F1E40;color:#E8EEFA;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.we .wea{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;line-height:1.75}
.we .weq>b,.we .wea>b:first-child{display:block;font-size:13px;opacity:.7;margin-bottom:6px;font-weight:700}
.we .wea p{margin:6px 0}.we .wea ul,.we .wea ol{margin:6px 0;padding-inline-start:22px}.we .wea li{margin:3px 0}
.we .wen{margin:12px 0 0;font-size:15px}.we .wen b{color:var(--red)}
.we .wed{margin:4px 0 0;color:var(--mute);font-size:13px}
@media print{.we{break-inside:avoid}}
</style>
</head>

     "t": "ما هو الذكاء الاصطناعي التوليدي؟",
     "body": "<p>الأدوات مثل ChatGPT وClaude وGemini تعمل بنموذج لغوي كبير. النموذج تدرّب على كمية ضخمة من النصوص، فتعلّم كيف تُكتب اللغة وكيف تترابط الأفكار.</p>\n<p>عندما تكتب له طلباً، هو لا «يبحث» عن إجابة محفوظة. هو <b>يكتب</b> الإجابة كلمة بكلمة، بناءً على ما فهمه من طلبك.</p>\n<div class=\"key\"><b>الفكرة الأهم</b>جودة الإجابة تعتمد بشكل كبير على وضوح طلبك. طلب غامض يعطيك إجابة عامة، وطلب واضح يعطيك إجابة تصلح لعملك.</div>\n<ul><li>يكتب ويلخّص ويترجم ويعيد الصياغة</li><li>يحلل النصوص والجداول ويشرح الأرقام</li><li>يقترح أفكاراً وخططاً وبدائل</li></ul>",
     "ex": [],
     "try": "افتح أداة ذكاء اصطناعي واكتب: «اشرح لي ما هو الذكاء الاصطناعي التوليدي في 3 جمل بسيطة، كأنني موظف جديد». قارن الإجابة بما قرأته هنا.",
     "we": {

<script>
/* ---------- state ---------- */
const PREVIEW=true;if(PREVIEW)MODULES.length=1;
const KEY=PREVIEW?'x10_ess_prev_v1':'x10_ess_v1';
let S={done:{},quiz:{},notes:{},name:'',lang:'ar',cur:'intro'};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S=Object.assign(S,j)}catch(e){}
try{const gl=localStorage.getItem('x10_lang');if(gl==='en'||gl==='ar')S.lang=gl}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const en=()=>S.lang==='en';
const T=(a,e)=>en()?e:a;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* steps: intro, then for each module its lessons and its quiz, then cert */
const STEPS=[{k:'intro'}];
MODULES.forEach((m,mi)=>{m.lessons.forEach((l,li)=>STEPS.push({k:`l${mi}-${li}`,mi,li}));STEPS.push({k:`q${mi}`,mi,quiz:true})});
STEPS.push({k:'cert'});
const LESSONS=STEPS.filter(s=>s.li!==undefined);
const PASS=2; // of 3
const lessonNo=k=>LESSONS.findIndex(s=>s.k===k)+1;
const allDone=()=>LESSONS.every(s=>S.done[s.k])&&MODULES.every((m,i)=>(S.quiz[i]||0)>=PASS);
function progress(){const total=LESSONS.length+MODULES.length;const n=LESSONS.filter(s=>S.done[s.k]).length+MODULES.filter((m,i)=>(S.quiz[i]||0)>=PASS).length;return [n,total]}
/* ---------- sidebar ---------- */
function side(){let h='';
 h+=`<button type="button" ${S.cur==='intro'?'aria-current="true"':''} onclick="go('intro')"><span class="st">i</span><span>${T('عن الدورة','About the course')}</span></button>`;
 MODULES.forEach((m,mi)=>{h+=`<h4>${T('الوحدة','Module')} <span class="ltr">${mi+1}</span> · ${en()?m.en:m.ar}</h4>`;
  m.lessons.forEach((l,li)=>{const k=`l${mi}-${li}`;h+=`<button type="button" class="${S.done[k]?'done':''}" ${S.cur===k?'aria-current="true"':''} onclick="go('${k}')"><span class="st">${S.done[k]?'✓':lessonNo(k)}</span><span>${en()?l.en.t:l.ar.t}</span></button>`});
  const qk=`q${mi}`,ok=(S.quiz[mi]||0)>=PASS;h+=`<button type="button" class="${ok?'done':''}" ${S.cur===qk?'aria-current="true"':''} onclick="go('${qk}')"><span class="st">${ok?'✓':'?'}</span><span>${T('اختبار قصير','Short quiz')}</span></button>`});
 h+=`<h4>${T('النهاية','Finish')}</h4><button type="button" class="${allDone()?'done':''}" ${S.cur==='cert'?'aria-current="true"':''} onclick="go('cert')"><span class="st">★</span><span>${PREVIEW?T('الدورة الكاملة','Full course'):T('شهادة الإتمام','Certificate')}</span></button>`;
 document.getElementById('side').innerHTML=h;
 const [n,t]=progress();document.getElementById('bar').style.width=(100*n/t)+'%';document.getElementById('pg').textContent=`${Math.round(100*n/t)}%`;
 document.getElementById('ct').textContent=en()?COURSE.en.t:COURSE.ar.t}
/* ---------- views ---------- */
function navBtns(k){const i=STEPS.findIndex(s=>s.k===k);const p=STEPS[i-1],n=STEPS[i+1];
 return `<div class="nav">${p?`<button class="btn ghost" type="button" onclick="go('${p.k}')">${T('→ السابق','← Back')}</button>`:'<span></span>'}${n?`<button class="btn" type="button" onclick="${k.startsWith('l')?`done('${k}');`:''}go('${n.k}')">${k.startsWith('l')?T('أكملت الدرس، التالي ←','Mark done, next →'):T('التالي ←','Next →')}</button>`:''}</div>`}
function vIntro(){const C=en()?COURSE.en:COURSE.ar;const first=STEPS.find(s=>s.li!==undefined&&!S.done[s.k])||STEPS[1];
 return `<div class="intro"><span class="eyebrow">${PREVIEW?T('عيّنة مجانية: الوحدة الأولى','Free preview: module 1'):T('دورة ذاتية أونلاين','Self-paced online course')}</span><h1>${C.t}</h1><div class="meta">${C.s}</div>
 <div class="facts"><div>${T('المدة مع التطبيق','Length, with practice')}<b>${C.mins}</b></div><div>${T('المستوى','Level')}<b>${T('مبتدئ','Beginner')}</b></div><div>${T('الوصول','Access')}<b>${T('متى ما تبي، بالسرعة اللي تناسبك','Any time, at your own pace')}</b></div></div>
 <p>${T('في هذه الدورة تتعلم كيف تستخدم الذكاء الاصطناعي في عملك اليومي: كيف يفكر، كيف تكتب له طلباً واضحاً، كيف تطبّقه على الإيميلات والتلخيص والبحث، وكيف تستخدمه بأمان.','In this course you learn to use AI in your daily work: how it thinks, how to write a clear request, how to apply it to email, summaries and research, and how to use it safely.')}</p>
 <div class="sec"><h3>${T('ماذا تحتاج','What you need')}</h3><ul><li>${T('حساب مجاني في أي أداة ذكاء اصطناعي مثل ChatGPT أو Claude أو Gemini','A free account with any AI tool such as ChatGPT, Claude or Gemini')}</li><li>${T('مهام حقيقية من عملك لتطبّق عليها','Real tasks from your work to practise on')}</li></ul></div>
 <div class="sec"><h3>${T('كيف تعمل الدورة','How it works')}</h3><ul><li>${T('12 درساً قصيراً في 4 وحدات، وكل درس فيه مثال وتمرين','12 short lessons in 4 modules, each with an example and an exercise')}</li><li>${T(`القراءة نحو ${rtotal()} دقيقة، وباقي الوقت تطبيق على مهامك أنت`,`Reading takes about ${rtotal()} minutes; the rest of the time is practice on your own tasks`)}</li><li>${T('اختبار قصير بعد كل وحدة: أجب عن سؤالين من 3 على الأقل','A short quiz after each module: get at least 2 of 3 right')}</li><li>${T('شهادة إتمام من معهد X10 عند إنهاء الدورة','An X10 certificate of completion when you finish')}</li><li>${T('تقدّمك وملاحظاتك تُحفظ تلقائياً','Your progress and notes are saved automatically')}</li></ul></div>
 <div class="nav"><span></span><button class="btn red" type="button" onclick="go('${first.k}')">${Object.keys(S.done).length?T('أكمل من حيث توقفت ←','Continue where you left off →'):T('ابدأ الدورة ←','Start the course →')}</button></div></div>`}
function rmin(L){const t=[L.body,(L.ex||[]).join(' '),L.try,L.we?L.we.q+' '+L.we.a+' '+L.we.n:''].join(' ').replace(/<[^>]+>/g,' ');return Math.max(1,Math.round(t.trim().split(/\s+/).length/170))}
function rtotal(){return LESSONS.reduce((a,s)=>{const l=MODULES[s.mi].lessons[s.li];return a+rmin(en()?l.en:l.ar)},0)}
function vLesson(st){const m=MODULES[st.mi],l=m.lessons[st.li],L=en()?l.en:l.ar;
 return `<span class="eyebrow">${T('الوحدة','Module')} <span class="ltr">${st.mi+1}</span> · ${T('الدرس','Lesson')} <span class="ltr">${lessonNo(st.k)}</span></span><h1>${L.t}</h1><div class="meta">${T('قراءة','Read')}: <span class="ltr">${rmin(L)}</span> ${T('د','min')} · ${T('تطبيق','Practice')}: <span class="ltr">${Math.max(1,l.min-rmin(L))}</span> ${T('د','min')}</div>
 <div class="body">${L.body}</div>
 ${L.ex.length?`<div class="sec"><h3>${L.ex.length>1?T('طلبات جاهزة للنسخ','Prompts to copy'):T('قالب جاهز للنسخ','Template to copy')}</h3>${L.ex.map((p,i)=>`<div class="pr"><span id="p${i}">${esc(p)}</span><button type="button" onclick="cp(${i},this)">${T('نسخ','Copy')}</button></div>`).join('')}</div>`:''}
 ${L.we?`<div class="sec we"><h3>${T('مثال محلول','Worked example')}</h3><div class="weq"><b>${T('الطلب','The request')}</b>${esc(L.we.q)}</div><div class="wea"><b>${T('نتيجة جيدة تبدو هكذا','A good result looks like this')}</b>${L.we.a}</div><p class="wen"><b>${T('لاحظ:','Notice:')}</b> ${L.we.n}</p><p class="wed">${T('مثال توضيحي. نتيجتك ستختلف حسب الأداة وتفاصيلك.','An illustration. Your result will differ with your tool and your details.')}</p></div>`:''}
 <div class="sec try"><b>${T('جرّب الآن','Try it now')}</b>${L.try}</div>
 <div class="sec"><h3>${T('ملاحظاتك','Your notes')}</h3><textarea id="note" placeholder="${T('اكتب هنا ما جربته وما تعلمته…','Write what you tried and learned…')}">${esc(S.notes[st.k]||'')}</textarea><div class="saved" id="sv"></div></div>
 ${navBtns(st.k)}`}
function vQuiz(st){const m=MODULES[st.mi];const best=S.quiz[st.mi]||0;
 return `<span class="eyebrow">${T('اختبار الوحدة','Module quiz')} <span class="ltr">${st.mi+1}</span></span><h1>${en()?m.en:m.ar}</h1><div class="meta">${T('أجب عن سؤالين من 3 على الأقل للنجاح.','Get at least 2 of 3 right to pass.')}${best?` ${T('أفضل نتيجة:','Best score:')} <span class="ltr">${best}/3</span>`:''}</div>

-top:14px">${d} · ${T('معهد X10 للتدريب الأهلي، الكويت','X10 Institute for Private Training, Kuwait')}</div></div><div class="noprint" style="margin-top:22px;background:linear-gradient(150deg,var(--navy),var(--steel));color:#fff;border-radius:20px;padding:22px 24px"><span class="eyebrow">${T('عرض للخريجين فقط','Graduates only')}</span><h3 style="margin:10px 0 4px;font-size:22px">${T('الخطوة التالية: الوصول الكامل لجميع الدورات','Next step: All-Access to every course')}</h3><p style="margin:0 0 14px;opacity:.9">${T('كل دورات X10 المدفوعة بسعر 349 د.ك بدل 708 د.ك. وتفتح لك كلها فور الدفع.','Every paid X10 course for KWD 349 instead of KWD 708. All of them open for you right after payment.')}</p><a class="btn red" href="../../#offer-all">${T('احصل على العرض ←','Get the offer →')}</a></div>`}
/* ---------- actions ---------- */
function go(k){S.cur=k;save();const st=STEPS.find(s=>s.k===k)||STEPS[0];const v=document.getElementById('view');
 v.innerHTML=k==='intro'?vIntro():k==='cert'?vCert():st.quiz?vQuiz(st):vLesson(st);
 side();document.body.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');scrollTo({top:0});
 const note=document.getElementById('note');if(note)note.addEventListener('input',()=>{S.notes[k]=note.value;save();document.getElementById('sv').textContent=T('تم الحفظ','Saved')});
 const qf=document.getElementById('qf');if(qf)qf.addEventListener('submit',e=>{e.preventDefault();grade(st)});
 const nm=document.getElementById('nm');if(nm)nm.addEventListener('input',()=>{S.name=nm.value;save();document.getElementById('cw').textContent=nm.value||'—'})}
function rot(a,n){n=n%a.length;return a.slice(n).concat(a.slice(0,n))}
/* where the right answer is shown: every position is used once in each quiz, and the order differs from course to course */
const QPOS=[[1,0,2],[2,1,0],[0,2,1],[1,2,0]];
const QH=[...KEY].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const qpos=(mi,qi)=>(QPOS[(mi+QH)%4][qi%3]+(QH>>>2))%3;
function done(k){S.done[k]=true;save()}
function grade(st){const m=MODULES[st.mi];let sc=0,miss=0;
 m.quiz.forEach((q,qi)=>{const box=document.getElementById('q'+qi);const sel=box.querySelector('input:checked');box.querySelectorAll('label').forEach(l=>l.classList.remove('right','wrong'));
  if(!sel){miss++;return}const v=+sel.value;box.classList.add('show');box.querySelector(`input[value="${q.a}"]`).closest('label').classList.add('right');if(v===q.a)sc++;else sel.closest('label').classList.add('wrong')});
 const r=document.getElementById('res');
 if(miss){r.innerHTML=`<div class="score fail">${T('أجب عن كل الأسئلة أولاً.','Answer every question first.')}</div>`;return}
 S.quiz[st.mi]=Math.max(S.quiz[st.mi]||0,sc);save();side();
 r.innerHTML=sc>=PASS?`<div class="score pass">${T('ممتاز!','Well done!')} <span class="ltr">${sc}/3</span>. ${T('نجحت في هذه الوحدة.','You passed this module.')}</div>`:`<div class="score fail"><span class="ltr">${sc}/3</span>. ${T('راجع الشرح تحت كل سؤال وحاول مرة ثانية.','Read the explanation under each question and try again.')}</div>`}
function cp(i,b){const t=document.getElementById('p'+i).textContent;
 const ok=()=>{b.textContent=T('تم النسخ','Copied');setTimeout(()=>b.textContent=T('نسخ','Copy'),1500)};
 try{navigator.clipboard.writeText(t).then(ok,()=>{selectText(i);b.textContent=T('حدّد وانسخ','Select and copy')})}catch(e){selectText(i)}}
function selectText(i){const r=document.createRange();r.selectNodeContents(document.getElementById('p'+i));const s=getSelection();s.removeAllRanges();s.addRange(r)}
function setLang(l){S.lang=l;save();try{localStorage.setItem('x10_lang',l)}catch(e){}document.documentElement.lang=l==='en'?'en':'ar';document.documentElement.dir=l==='en'?'ltr':'rtl';
 document.getElementById('langBtn').textContent=l==='en'?'العربية':'English';document.querySelectorAll('[data-t]').forEach(e=>{const [a,b]=e.dataset.t.split('|');e.textContent=l==='en'?b:a});go(S.cur)}
document.getElementById('langBtn').addEventListener('click',()=>setLang(en()?'ar':'en'));
document.getElementById('menuBtn').addEventListener('click',e=>{const o=document.body.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)});
setLang(S.lang);
</script>
