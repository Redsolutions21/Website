<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>X10 · حسابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#20396F;--deep:#14264F;--steel:#5B7991;--red:#ED1C24;--ink:#14213D;--mute:#5A6478;--bg:#EEF2F7;--tile:#E2E8F0;--card:#F8FAFD;--line:#D3DBE6;--ar:'Almarai',Tahoma,sans-serif;--en:'Lato',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.8;font-size:16px}html[lang=en] body{font-family:var(--en);line-height:1.6}
button,input{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
header{background:var(--deep);color:#fff}header .in{max-width:1000px;margin:0 auto;padding:0 18px;height:58px;display:flex;align-items:center;gap:12px}
header a.b{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;flex:1}header img{height:28px}
.hb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:24px;padding:28px}
.dark{background:linear-gradient(150deg,var(--navy),var(--steel));color:#fff}
h1{font-size:clamp(26px,4vw,36px);line-height:1.3;margin:8px 0 6px}h2{font-size:22px;margin:0 0 8px}h3{font-size:18px;margin:0}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 10px;font-weight:700;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--tile);border-radius:999px;padding:4px;margin:14px 0}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px;font-weight:700;color:var(--mute)}.tabs button[aria-selected=true]{background:#fff;color:var(--ink)}
label{display:grid;gap:4px;font-weight:700;font-size:14px;margin-top:10px}
input{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;width:100%}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--navy);color:#fff;text-decoration:none;text-align:center}
.btn.red{background:var(--red)}.btn.w{width:100%;margin-top:16px}.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.msg{min-height:22px;font-size:14px;color:#B3141A;margin-top:8px}
.dark ul{padding-inline-start:20px;margin:10px 0 0}.dark li{margin:6px 0}
.demo{background:#FFF8E1;border:1px dashed #E0A800;border-radius:12px;padding:8px 12px;font-size:13px;color:#7A4B00;margin-bottom:14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0}
.it small{display:block;color:var(--mute)}
.up{border-radius:20px;padding:20px 22px;margin-top:14px}
.up p{margin:6px 0 12px;opacity:.92}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.soon div{background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.soon b{white-space:nowrap}
.itx{flex:1 1 220px;min-width:0}
.pb{height:6px;border-radius:999px;background:var(--tile);margin:8px 0 2px;overflow:hidden}.pb i{display:block;height:100%;background:var(--red);border-radius:999px}
.st{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#7A4B00;background:#FFF8E1;border:1px solid #E0A800;border-radius:999px;padding:1px 10px}
.st.rv{color:#B3141A;background:#FDECEC;border-color:#F0A8AB}
</style>
</head>

function vAuth(){const buying=next();
 return `<div class="split"><div class="card">

 <span class="tag">${buying?T('خطوة 1 من 2','Step 1 of 2'):T('حسابي','My account')}</span>

 <button class="btn red w" type="submit">${TAB==='up'?(buying?T('أنشئ الحساب وأكمل الشراء','Create account and continue'):T('أنشئ حسابي','Create my account')):T('دخول','Log in')}</button>

 let mine=CAT.filter(canOpen).map(courseCard).join('');
 const JRS=(typeof X10_JUNIORS!=='undefined'?X10_JUNIORS:[]).filter(c=>X10Auth.owns(c.id));
 mine+=JRS.map(c=>{const p=prog(c);return `<div class="it"><div class="itx"><h3>${en()?c.en:c.ar}</h3><small>AI Juniors · ${en()?c.band_en:c.band_ar} · ${T('12 درساً · 4 اختبارات · شهادة','12 lessons · 4 quizzes · certificate')}</small><div class="pb" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div><small>${p===100?T('مكتملة','Completed'):p?T(`أنجزت ${p}٪`,`${p}% done`):T('لم تبدأ بعد','Not started')}</small></div><a class="btn ${p===100?'':'red'}" href="${c.path}">${p===100?T('راجع الدورة','Review the course'):p?T('أكمل الدورة','Continue the course'):T('ابدأ الدورة','Start the course')}</a></div>`}).join('');
 if(lib)mine+=`<div class="it"><div><h3>${T('مكتبة الطلبات','Prompt Library')}</h3><small>${T('50 طلباً جاهزاً للعمل','50 ready prompts for work')}</small></div><a class="btn" href="${X10_LIB.path}">${T('افتح المكتبة','Open the library')}</a></div>`;
 const F=SALE.find(c=>c.live&&c.p===0);
 if(!mine)mine=`<div class="it"><div><h3>${T('لا توجد دورات بعد','No courses yet')}</h3><small>${F?T('ابدأ بإحدى دوراتنا المجانية، أو تصفّح كل الدورات.','Start with one of our free courses, or browse all the courses.'):T('تصفّح الدورات واختر ما يناسبك.','Browse the courses and pick what suits you.')}</small></div><span style="display:flex;gap:8px;flex-wrap:wrap">${F?`<a class="btn red" href="./#buy-${F.id}">${T('ابدأ مجاناً: ','Start free: ')}${en()?F.en:F.ar}</a>`:''}<a class="btn ghost" href="./#programs">${T('تصفّح الدورات','Browse the courses')}</a></span></div>`;
 const tail=ALLLIVE?T('جميع الدورات تفتح لك فور الدفع.','Every course opens for you right after payment.'):T('كل دورة جديدة تفتح لك يوم إطلاقها.','Each new course unlocks the day it launches.');
 let ups='';
 if(!all)ups+=`<div class="up dark"><span class="tag">${cr?T('عرض الترقية','Upgrade offer'):T('الأوفر','Best value')}</span><h3 style="margin-top:8px">${T('الوصول الكامل لجميع الدورات','All-Access to every course')}</h3><p>${cr?T(`${kd(X10_ALL.p)}، ونخصم ما دفعته في دوراتك (${kd(cr)}): تدفع ${kd(X10_ALL.p-cr)} فقط.`,`${kd(X10_ALL.p)}, minus what you have paid for your courses (${kd(cr)}): only ${kd(X10_ALL.p-cr)}.`):T(`${kd(X10_ALL.p)} بدل ${kd(X10_ALL.was)}.`,`${kd(X10_ALL.p)} instead of ${kd(X10_ALL.was)}.`)} ${tail}</p><a class="btn red" href="./#${cr?'offer-all':'buy-all'}">${T('رقِّ حسابي','Upgrade my account')} · ${kd(X10_ALL.p-cr)}</a></div>`;
 if(!lib)ups+=`<div class="up" style="background:#FFF8E1;border:2px dashed #E0A800"><h3>${T('أضف مكتبة الطلبات','Add the Prompt Library')}</h3><p style="color:var(--mute)">${T('50 طلباً جاهزاً للعمل بالعربي والإنجليزي: إيميلات، اجتماعات، كتابة، تخطيط، Excel.','50 ready work prompts in Arabic and English: email, meetings, writing, planning, Excel.')}</p><a class="btn" href="./#buy-lib">${T('أضفها','Add it')} · <s style="opacity:.7">${kd(X10_LIB.was)}</s> ${kd(X10_LIB.p)}</a></div>`;
 const later=SALE.filter(c=>!c.live),more=SALE.filter(c=>c.live&&!X10Auth.owns(c.id));
 const soon=later.length?`<h2 style="margin-top:22px">${T('قريباً','Coming soon')}</h2><p style="color:var(--mute);margin:0;font-size:14px">${all?T('كلها مشمولة في الوصول الكامل، وتفتح لك يوم إطلاقها.','All included in your All-Access; each opens the day it launches.'):T('مشمولة كلها في الوصول الكامل.','All included in All-Access.')}</p>
 <div class="soon">${later.map(c=>`<div><span>${en()?c.en:c.ar}</span><b><s style="color:var(--mute);font-weight:400">${kd(c.was)}</s> ${c.p?kd(c.p):T('مجاناً','Free')}</b></div>`).join('')}</div>`:(more.length&&mine?`<h2 style="margin-top:22px">${T('دورات أخرى','More courses')}</h2>
 <div class="soon">${more.map(c=>`<a href="./#buy-${c.id}" style="background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:inherit"><span>${en()?c.en:c.ar}</span><b><s style="color:var(--mute);font-weight:400">${kd(c.was)}</s> ${c.p?kd(c.p):T('مجاناً','Free')}</b></a>`).join('')}</div>`:'');
 return `${X10Auth.REAL?'':`<div class="demo">${T('وضع تجريبي للمعاينة: الحساب والمشتريات تُحفظ على هذا المتصفح فقط.','Preview demo mode: account and purchases are kept in this browser only.')}${st?' '+T('هذا حساب المراجعة: يفتح كل الدورات، ومنها ما يحتاج إلى مراجعة قبل البيع.','This is the review account: it opens every course, including the one still under review.'):''}</div>`}
 <span class="tag">${T('حسابي','My account')}</span><h1>${T('أهلاً','Welcome')}${u.name?T('، ',', ')+esc(u.name):''}</h1><p style="color:var(--mute);margin:0;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span dir="ltr">${esc(u.email)}</span><button type="button" onclick="EDIT=true;render()" style="background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;font-weight:600">${T('عدّل بياناتي','Edit my details')}</button></p>${SAVED?`<p style="color:#1E8E5A;margin:8px 0 0;font-weight:600">${T('تم حفظ بياناتك.','Your details are saved.')}</p>`:''}
 <div class="split" style="margin-top:18px"><div class="card"><h2>${T('دوراتي','My courses')}</h2>${mine}${st?'':soon}</div>
 <div>${(typeof X10_JUNIORS!=='undefined'&&!X10Auth.owns('juniors'))?`<div class="up" style="background:#fff;border:1px solid var(--line)"><span class="tag">AI Juniors</span><h3 style="margin-top:8px">${T('دورات الذكاء الاصطناعي لأطفالك','AI courses for your children')}</h3><p style="color:var(--mute)">${T('3 دورات آمنة للأعمار من 7 إلى 16، بالعربية والإنجليزية.','3 safe courses for ages 7 to 16, in Arabic and English.')}</p><a class="btn" href="juniors.html">${T('تعرّف عليها','See the courses')}</a></div>`:''}${ups||`<div class="card dark"><h2>${T('حسابك كامل','You have everything')}</h2><p>${st?T('كل الدورات مفتوحة لك للمراجعة.','Every course is open to you for review.'):ALLLIVE?T('كل الدورات ومكتبة الطلبات مفتوحة لك.','Every course and the Prompt Library are open to you.'):T('سنبلغك عند إطلاق كل دورة جديدة.','We will tell you when each new course launches.')}</p></div>`}</div></div>`}
let EDIT=false,SAVED=false;
function vEdit(){const u=X10Auth.user;return `<div class="split"><div class="card"><span class="tag">${T('حسابي','My account')}</span><h1>${T('بياناتي','My details')}</h1>
 <form id="ef" novalidate><label>${T('الاسم الكامل','Full name')}<input id="ename" autocomplete="name" value="${esc(u.name)}" required></label>
 <p style="color:var(--mute);font-size:13px;margin:-4px 0 10px">${T('هذا الاسم يظهر في حسابك.','This is the name shown on your account.')}</p>
 <label>${T('رقم الهاتف','Mobile')}<input id="emobile" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="${esc(u.mobile)}"></label>
 <label>${T('البريد الإلكتروني','Email')}<input type="email" dir="ltr" value="${esc(u.email)}" disabled style="opacity:.7"></label>
 <p style="color:var(--mute);font-size:13px;margin:-4px 0 10px">${T('لتغيير البريد الإلكتروني راسلنا على hello@solutionsbyred.com.','To change your email, write to hello@solutionsbyred.com.')}</p>
 ${X10Auth.REAL?`<label>${T('كلمة مرور جديدة (اختياري)','New password (optional)')}<input id="epw" type="password" autocomplete="new-password" minlength="8" placeholder="${T('اتركها فارغة لتبقى كما هي','Leave empty to keep it')}"></label>`:''}
 <button class="btn red w" type="submit">${T('احفظ','Save')}</button>
 <button type="button" onclick="EDIT=false;render()" style="background:none;border:0;padding:0;margin:10px 0 0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px">${T('رجوع','Back')}</button>
 <div class="msg" id="msg" role="alert"></div></form></div></div>`}
async function editSubmit(e){e.preventDefault();const m=document.getElementById('msg'),name=document.getElementById('ename').value.trim(),mobile=document.getElementById('emobile').value.trim(),pe=document.getElementById('epw'),pw=pe?pe.value:'';m.textContent='';
 if(!name){m.textContent=T('اكتب اسمك.','Enter your name.');return}
 if(pw&&pw.length<8){m.textContent=T('كلمة المرور 8 أحرف على الأقل.','Password must be at least 8 characters.');return}
 const b=e.target.querySelector('button[type=submit]');b.disabled=true;
 let r=await X10Auth.updateProfile({name,mobile});
 if(!r.error&&pw)r=await X10Auth.setPassword(pw);
 b.disabled=false;
 if(r.error){m.textContent=T('تعذّر الحفظ. حاول مرة ثانية.','Could not save. Please try again.');return}
 EDIT=false;SAVED=true;render();setTimeout(()=>{SAVED=false},100)}
function vNewPw(){return `<div class="split"><div class="card"><span class="tag">${T('حسابي','My account')}</span><h1>${T('اختر كلمة مرور جديدة','Choose a new password')}</h1>
 <form id="nf" novalidate><label>${T('كلمة المرور الجديدة','New password')}<input id="npw" type="password" autocomplete="new-password" minlength="8" required></label>
 <button class="btn red w" type="submit">${T('احفظ كلمة المرور','Save password')}</button><div class="msg" id="msg" role="alert"></div></form></div></div>`}
async function newPw(e){e.preventDefault();const m=document.getElementById('msg'),pw=document.getElementById('npw').value;m.textContent='';
 if(pw.length<8){m.textContent=T('كلمة المرور 8 أحرف على الأقل.','Password must be at least 8 characters.');return}
 const r=await X10Auth.setPassword(pw);if(r.error){m.textContent=T('تعذّر حفظ كلمة المرور. اطلب رابطاً جديداً وحاول مرة ثانية.','Could not save the password. Request a new link and try again.');return}
 RECOVERY=false;try{history.replaceState(null,'',location.pathname)}catch(e){}render()}
async function forgot(){const m=document.getElementById('msg'),email=(document.getElementById('email').value||'').trim();m.style.color='';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.textContent=T('اكتب بريدك الإلكتروني أولاً، ثم اضغط «نسيت كلمة المرور».','Enter your email first, then press "Forgot your password?".');return}
 const r=await X10Auth.resetPassword(email);if(r.error&&/rate|seconds|many/i.test(r.error)){m.textContent=T('طلبت رمزاً قبل قليل. انتظر دقيقة ثم حاول مرة ثانية.','You asked for a code a moment ago. Wait a minute and try again.');return}
 RESET=email;render()}
let RESET='',VERIFY='';
function vVerify(){return `<div class="split"><div class="card"><span class="tag">${next()?T('خطوة 1 من 2','Step 1 of 2'):T('حسابي','My account')}</span><h1>${T('أكّد بريدك الإلكتروني','Confirm your email')}</h1>
 <p style="color:var(--mute);margin:0 0 10px">${T('أرسلنا رمزاً من أرقام إلى بريدك. اكتبه هنا في هذه الصفحة لتفعيل حسابك.','We sent a number code to your email. Type it here on this page to activate your account.')}</p>
 <p dir="ltr" style="margin:0 0 12px;font-weight:600">${esc(VERIFY)}</p>
 <form id="vf" novalidate><label>${T('الرمز من البريد','Code from the email')}<input id="vcode" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="done" dir="ltr" maxlength="12" required></label>
 <button class="btn red w" type="submit">${T('فعّل حسابي','Activate my account')}</button>
 <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px"><button type="button" id="rsBtn" onclick="resend()" style="background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px">${T('أرسل الرمز مرة ثانية','Send the code again')}</button>
 <button type="button" onclick="VERIFY='';render()" style="background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px">${T('رجوع','Back')}</button></div>
 <div class="msg" id="msg" role="alert"></div></form>
 <p style="color:var(--mute);font-size:13px;margin:12px 0 0">${T('لم يصلك؟ انظر في مجلد الرسائل غير المرغوبة، أو اطلبه مرة ثانية بعد دقيقة.','Nothing yet? Check your spam folder, or send it again after a minute.')}</p></div></div>`}
async function verifySubmit(e){e.preventDefault();const m=document.getElementById('msg'),code=document.getElementById('vcode').value.replace(/\D/g,'');m.style.color='';m.textContent='';
 if(code.length<6){m.textContent=T('اكتب الرمز كاملاً كما وصلك.','Type the full code from the email.');return}
 const r=await X10Auth.confirmCode(VERIFY,code);if(r.error){m.textContent=T('الرمز غير صحيح أو انتهت صلاحيته. اطلب رمزاً جديداً.','The code is wrong or has expired. Send a new one.');return}
 VERIFY='';if(next()){location.href=nextUrl();return}await X10Auth.pullProgress();render()}
async function resend(){const m=document.getElementById('msg'),b=document.getElementById('rsBtn');const r=await X10Auth.resendSignup(VERIFY);
 if(r.error){m.style.color='';m.textContent=/rate|seconds|many/i.test(r.error)?T('انتظر دقيقة ثم اطلبه مرة ثانية.','Wait a minute, then ask again.'):T('تعذّر الإرسال. حاول بعد قليل.','Could not send. Try again shortly.');return}
 m.style.color='#1E8E5A';m.textContent=T('أرسلنا رمزاً جديداً.','We sent a new code.');if(b){b.disabled=true;setTimeout(()=>{b.disabled=false},60000)}}
function vCode(){return `<div class="split"><div class="card"><span class="tag">${T('حسابي','My account')}</span><h1>${T('غيّر كلمة المرور','Change your password')}</h1>
 <p style="color:var(--mute);margin:0 0 10px">${T('إذا كان هذا البريد مسجّلاً، فقد أرسلنا إليه رمزاً من أرقام. اكتبه هنا في هذه الصفحة، ثم اختر كلمة مرور جديدة.','If this email is registered, we sent it a number code. Type it here on this page, then choose a new password.')}</p>
 <p dir="ltr" style="margin:0 0 12px;font-weight:600">${esc(RESET)}</p>
 <form id="cf" novalidate><label>${T('الرمز من البريد','Code from the email')}<input id="code" inputmode="numeric" autocomplete="one-time-code" enterkeyhint="next" dir="ltr" maxlength="12" required></label>
 <label>${T('كلمة المرور الجديدة','New password')}<input id="cpw" type="password" autocomplete="new-password" minlength="8" required></label>
 <button class="btn red w" type="submit">${T('احفظ وادخل','Save and log in')}</button>
 <button type="button" onclick="RESET='';render()" style="background:none;border:0;padding:0;margin:10px 0 0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px">${T('رجوع','Back')}</button>
 <div class="msg" id="msg" role="alert"></div></form>
 <p style="color:var(--mute);font-size:13px;margin:12px 0 0">${T('لم يصلك؟ انظر في مجلد الرسائل غير المرغوبة، أو ارجع واطلب رمزاً جديداً بعد دقيقة.','Nothing yet? Check your spam folder, or go back and ask for a new code after a minute.')}</p></div></div>`}
async function codeSubmit(e){e.preventDefault();const m=document.getElementById('msg'),code=document.getElementById('code').value.replace(/\D/g,''),pw=document.getElementById('cpw').value;m.style.color='';m.textContent='';
 if(code.length<6){m.textContent=T('اكتب الرمز كاملاً كما وصلك.','Type the full code from the email.');return}
 if(pw.length<8){m.textContent=T('كلمة المرور 8 أحرف على الأقل.','Password must be at least 8 characters.');return}
 let r=await X10Auth.verifyCode(RESET,code);if(r.error){m.textContent=T('الرمز غير صحيح أو انتهت صلاحيته. ارجع واطلب رمزاً جديداً.','The code is wrong or has expired. Go back and ask for a new one.');return}
 r=await X10Auth.setPassword(pw);if(r.error){m.textContent=T('تعذّر حفظ كلمة المرور. حاول مرة ثانية.','Could not save the password. Please try again.');return}
 RESET='';if(next()){location.href=nextUrl();return}await X10Auth.pullProgress();render()}
function render(){chrome();const rec=RECOVERY&&X10Auth.user;document.getElementById('v').innerHTML=rec?vNewPw():X10Auth.user?(EDIT?vEdit():vDash()):VERIFY?vVerify():RESET?vCode():vAuth();
 const vf=document.getElementById('vf');if(vf){vf.addEventListener('submit',verifySubmit);setTimeout(()=>document.getElementById('vcode').focus(),50)}
 const cf=document.getElementById('cf');if(cf){cf.addEventListener('submit',codeSubmit);cf.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code'){e.preventDefault();document.getElementById('cpw').focus()}});setTimeout(()=>document.getElementById('code').focus(),50)}
 const f=document.getElementById('f');if(f){f.addEventListener('submit',submit);f.addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'||e.altKey||e.ctrlKey||e.metaKey)return;const ins=[...f.querySelectorAll('input')],i=ins.indexOf(e.target);if(e.key==='Tab'&&!e.shiftKey&&i<ins.length-1){e.preventDefault();ins[i+1].focus()}else if(e.key==='Tab'&&e.shiftKey&&i>0){e.preventDefault();ins[i-1].focus()}else if(e.key==='Enter'&&i<ins.length-1){e.preventDefault();ins[i+1].focus()}})}const nf=document.getElementById('nf');if(nf)nf.addEventListener('submit',newPw);const ef=document.getElementById('ef');if(ef)ef.addEventListener('submit',editSubmit)}
async function submit(e){e.preventDefault();const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''},m=document.getElementById('msg');m.textContent='';
 const email=g('email'),pw=document.getElementById('pw').value;
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.textContent=T('اكتب بريداً إلكترونياً صحيحاً.','Enter a valid email address.');return}
 if(pw.length<8){m.textContent=T('كلمة المرور 8 أحرف على الأقل.','Password must be at least 8 characters.');return}
 let r;
 if(TAB==='up'){if(!g('name')){m.textContent=T('اكتب اسمك.','Enter your name.');return}r=await X10Auth.signUp({name:g('name'),email,mobile:g('mobile'),password:pw})}
 else r=await X10Auth.signIn({email,password:pw});
 if(r.error==='unconfirmed'){VERIFY=email;await X10Auth.resendSignup(email);render();return}
 if(r.error){m.textContent=r.error==='exists'?T('هذا البريد عنده حساب. اختر «عندي حساب» وسجّل دخولك، وإذا نسيت كلمة المرور اختر «نسيت كلمة المرور».','This email already has an account. Choose "I have an account" and sign in, or use "Forgot password" if you need a new one.'):r.error==='nouser'||r.error==='bad'?T('البريد أو كلمة المرور غير صحيحة.','Email or password is incorrect.'):T('تعذّر إتمام العملية. حاول مرة ثانية.','Something went wrong. Please try again.');return}
 if(r.confirm){VERIFY=email;render();return}
 if(next()){location.href=nextUrl();return}
 await X10Auth.pullProgress();render()}
document.getElementById('lb').onclick=()=>{L=en()?'ar':'en';try{localStorage.setItem('x10_lang',L)}catch(e){}render()};
document.getElementById('outBtn').onclick=async()=>{await X10Auth.signOut();EDIT=false;render()};
X10Auth.load().then(()=>X10Auth.pullProgress()).then(render,render);
</script>
</body>
