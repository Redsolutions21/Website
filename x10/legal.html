 ['terms','Terms and conditions',`<p>These terms apply when you create an account or buy an online course or the Prompt Library from X10. By creating an account or placing an order you accept them.</p>
 <ul><li><b>What you buy.</b> A self-paced online course is a set of written lessons, ready prompts, exercises and quizzes, with a certificate of completion. Nothing is shipped and there is no live session unless the course page says so.</li>
 <li><b>Your account.</b> Give your correct name and email, keep your password private, and use one account per person. An account may not be shared, sold or transferred.</li>
 <li><b>Prices and payment.</b> Prices are in Kuwaiti dinars (KWD) and are the ones shown on the site when you order. Limited-time prices may end without notice, but an order already paid keeps its price. Payment is made through a licensed payment provider in Kuwait. We do not see or store your card details.</li>
 <li><b>Access.</b> Your course opens in your account once your payment is confirmed. You keep access for as long as X10 offers the course on this platform. If we ever retire a course you bought, we will tell you by email at least 30 days before.</li>
 <li><b>Licence.</b> The content is for your personal learning. You may use the prompts and templates in your own work. You may not copy, publish, record, resell or share the lessons, or let other people use your account.</li>
 <li><b>Certificate.</b> The certificate confirms that you completed the course on this platform. It is not an academic degree or a government-accredited qualification.</li>
 <li><b>What we do not promise.</b> The courses are educational. AI tools change often and their answers can be wrong, so you remain responsible for checking any result and for following your employer's rules. We do not guarantee a specific result, job or saving.</li>
 <li><b>Misuse.</b> We may suspend an account that shares access, copies content or abuses the service. In that case no refund is due.</li>
 <li><b>Our liability.</b> To the extent the law allows, our liability for any claim related to a purchase is limited to the amount you paid for it.</li>

 <li><b>Law.</b> These terms are governed by the laws of the State of Kuwait, and its courts have jurisdiction.</li></ul>`],
 ['delivery','Delivery policy',`<p>Everything we sell online is digital. Nothing is shipped.</p><ul><li>Your course or library appears under "My courses" in your account as soon as your payment is confirmed.</li><li>If you paid and your purchase has not opened within one working day, write to ${mail} with the email you used and we will fix it.</li><li>You can study from any device by logging in to your account. Your progress is saved to your account, so you can continue on another device.</li></ul>`],
 ['refund','Refund and cancellation policy',`<p>Our courses and the Prompt Library are digital products that open in your account right after payment. For that reason, <b>all sales are final and we do not offer refunds</b> once a purchase is paid, except in the cases below. You can take two courses in full, free, to see how our courses work before you buy: Introduction to AI and Be Safe with AI.</p><ul><li><b>Paid twice or charged in error?</b> We refund the extra amount in full at any time.</li><li><b>Access problem we cannot fix?</b> If we cannot give you working access within 5 working days of your report to ${mail}, we refund the full amount.</li><li><b>Where the law requires it.</b> Nothing in this policy removes a right that Kuwaiti law gives you.</li><li><b>How refunds are paid.</b> Refunds go back to the original payment method. The time it takes to appear depends on your bank.</li><li><b>After a refund</b> access to that course or library is removed from your account.</li><li><b>Cancelling an order.</b> An order that has not been paid can be cancelled at any time by not completing the payment.</li></ul>`],
 ['privacy','Privacy policy',`<p>This explains what we collect when you use the X10 online courses and what we do with it.</p>
 <ul><li><b>What we collect.</b> Your name, email and, if you give it, your mobile number; the courses you bought; and the payment reference we receive from the payment provider. We never receive your card number.</li>
 <li><b>Your progress.</b> Your lesson progress, quiz results and notes are saved in your browser and in your account, so you can continue on any device. Your language choice stays on your device only.</li>
 <li><b>Why we use it.</b> To create your account, open the courses you bought, answer your messages and send receipts and service notices. We send marketing messages only if you agreed to receive them, and you can stop them at any time.</li>
 <li><b>Who processes it for us.</b> Your account data is stored with Supabase, our database provider, on servers in the European Union (Frankfurt). Account emails, such as login and password codes, are sent through Google. Payments are handled by a payment provider licensed in Kuwait. The website files are hosted on GitHub Pages, which may keep standard technical logs such as IP addresses.</li>
 <li><b>What we never do.</b> We do not sell your data and we do not share it with advertisers.</li>
 <li><b>How long we keep it.</b> For as long as your account is open, and afterwards only for as long as accounting and legal rules require for payment records.</li>
 <li><b>Your choices.</b> Write to ${mail} to see, correct or delete your data, or to close your account. We answer within 30 days.</li>

 <li><b>Age.</b> The courses are for adults. Anyone under 18 needs a parent or guardian to buy and to agree to these terms.</li>
 <li><b>Security.</b> Access to the database is protected so that each account can read only its own data. No online service can promise perfect security; if a breach ever affects your data, we will tell you.</li></ul>`]]

 <li><b>الترخيص.</b> المحتوى لتعلّمك الشخصي. يحق لك استخدام الطلبات والقوالب في عملك. ولا يحق لك نسخ الدروس أو نشرها أو تسجيلها أو إعادة بيعها أو مشاركتها، ولا السماح لغيرك باستخدام حسابك.</li>

 <li><b>سوء الاستخدام.</b> يحق لنا إيقاف الحساب الذي يشارك الوصول أو ينسخ المحتوى أو يسيء استخدام الخدمة، ولا يُستحق استرداد في هذه الحالة.</li>

 <li><b>من يعالجه لصالحنا.</b> تُحفظ بيانات حسابك لدى Supabase، مزوّد قاعدة البيانات، على خوادم في الاتحاد الأوروبي (فرانكفورت). وتُرسل رسائل الحساب، مثل رموز الدخول وتغيير كلمة المرور، عبر Google. ويتولى المدفوعات مزوّد دفع مرخّص في الكويت. وتُستضاف ملفات الموقع على GitHub Pages، وقد تحتفظ بسجلات تقنية معتادة مثل عناوين الإنترنت.</li>
