<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>X10 · شكراً لك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#20396F;--deep:#14264F;--steel:#5B7991;--red:#ED1C24;--ink:#14213D;--mute:#5A6478;--bg:#EEF2F7;--card:#F8FAFD;--ar:'Almarai',Tahoma,sans-serif;--en:'Lato',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.8}html[lang=en] body{font-family:var(--en);line-height:1.6}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:680px;margin:0 auto;padding:40px 18px 60px}
.card{background:var(--card);border-radius:24px;padding:30px 28px;margin-top:16px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.3;margin:10px 0 6px}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 10px;font-weight:700;font-size:13px}
.btn{display:inline-block;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--navy);color:#fff;text-decoration:none}.btn.red{background:var(--red)}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0}
.it b{font-size:17px}.it small{display:block;color:var(--mute)}
.up{background:linear-gradient(150deg,var(--navy),var(--steel));color:#fff}.up p{opacity:.9}
.lb{border:0;background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;float:inline-end}
p.m{color:var(--mute);font-size:14px}
</style></head><body><div class="wrap"><button class="lb" id="lb" type="button"></button><div id="v"></div></div>
<script src="auth.js?v=acb5ddf1"></script>
<script src="catalog.js?v=bbb40917"></script>
<script>
/* The payment link's return URL says what was bought, as the hash:
   thanks.html#<course id> · #<course id>-lib · #all · #all-lib · #lib */
let L='ar';try{L=localStorage.getItem('x10_lang')||'ar'}catch(e){}
const en=()=>L==='en',T=(a,e)=>en()?e:a,kd=n=>x10kd(n,en());
function render(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';document.getElementById('lb').textContent=en()?'العربية':'English';
 const h=location.hash.replace('#',''),only=h==='lib',lib=/(^|-)lib$/.test(h),base=h.replace(/-?lib$/,''),all=base==='all',c=x10Course(base),known=only||all||!!(c&&c.live&&!c.review);
 const help=`<p class="m">${T('تحتاج مساعدة؟ راسلنا:','Need help? Write to us:')} <a href="mailto:${X10_MAIL}" dir="ltr">${X10_MAIL}</a></p>`;
 if(!known){document.getElementById('v').innerHTML=`<div class="card"><h1>${T('معهد X10','X10 Institute')}</h1><p>${T('لم نجد طلباً مرتبطاً بهذه الصفحة. إذا أتممت الدفع ولم تفتح دورتك، راسلنا بالبريد.','We could not find an order for this page. If you paid and your course did not open, write to us by email.')}</p>${help}<p><a class="btn" href="account.html">${T('اذهب إلى حسابي','Go to my account')}</a></p></div>`;return}
 X10Auth.demoGrant([...(c&&!all?[c.id]:[]),...(all?['all']:[]),...(lib?['lib']:[])]);
 const sale=X10_CATALOG.filter(x=>!x.review),allLive=sale.every(x=>x.live);
 let items=c&&!all?`<div class="it"><div><b>${en()?c.en:c.ar}</b><small>${T('12 درساً · 4 اختبارات · شهادة','12 lessons · 4 quizzes · certificate')}</small></div><a class="btn red" href="${c.path}">${T('ابدأ الدورة','Start the course')}</a></div>`:'';
 if(lib)items+=`<div class="it"><div><b>${T('مكتبة الطلبات','Prompt Library')}</b><small>${T('50 طلباً جاهزاً للعمل','50 ready prompts for work')}</small></div><a class="btn" href="${X10_LIB.path}">${T('افتح المكتبة','Open the library')}</a></div>`;
 if(all)items+=`<p class="m">${allLive?T('اشتريت الوصول الكامل: جميع الدورات مفتوحة في حسابك.','You bought All-Access: every course are open in your account.'):T('اشتريت الوصول الكامل: كل دورة جديدة تفتح في حسابك يوم إطلاقها، ونبلغك بالبريد.','You bought All-Access: each new course opens in your account the day it launches, and we will email you.')}</p>`;
 const paid=sale.filter(x=>x.live&&X10Auth.owned.includes(x.id)).reduce((a,x)=>a+x.p,0),upg=Math.max(0,X10_ALL.p-paid);
 let up='';
 if(!all&&!only&&!X10Auth.owns('all'))up=`<div class="card up"><span class="tag">${T('عرض الترقية','Upgrade offer')}</span><h2 style="margin:10px 0 4px">${T('رقِّ طلبك إلى الوصول الكامل','Upgrade to All-Access')}</h2><p>${T(`كل دورات X10 بـ${kd(X10_ALL.p)}، ونخصم الـ${kd(paid)} التي دفعتها: تدفع ${kd(upg)} فقط.`,`Every X10 course for ${kd(X10_ALL.p)}, minus the ${kd(paid)} you have paid: only ${kd(upg)}.`)} ${allLive?T('وتفتح لك كلها فور الترقية.','All of them open for you as soon as you upgrade.'):T('كل دورة جديدة تفتح لك يوم إطلاقها.','Each new course unlocks for you the day it launches.')}</p><a class="btn red" href="./#offer-all">${T('نعم، رقِّ طلبي','Yes, upgrade my order')} · <bdi dir="ltr">${kd(upg)}</bdi></a></div>`;
 else if(!lib&&!only&&!X10Auth.owns('lib'))up=`<div class="card up"><span class="tag">${T('إضافة سريعة','Quick add')}</span><h2 style="margin:10px 0 4px">${T('أضف مكتبة الطلبات','Add the Prompt Library')}</h2><p>${T('50 طلباً جاهزاً للعمل بالعربي والإنجليزي.','50 ready work prompts in Arabic and English.')}</p><a class="btn red" href="./#buy-lib">${T('أضفها','Add it')} · <bdi dir="ltr">${kd(X10_LIB.p)}</bdi></a></div>`;
 document.getElementById('v').innerHTML=`<div class="card"><span class="tag">${T('تم الدفع','Payment received')}</span><h1>${only?T('شكراً لك! مكتبتك جاهزة.','Thank you! Your library is ready.'):all?T('شكراً لك! دوراتك جاهزة.','Thank you! Your courses are ready.'):T('شكراً لك! دورتك جاهزة.','Thank you! Your course is ready.')}</h1><p>${T('دوراتك محفوظة في حسابك، وترجع لها أي وقت.','Your courses are saved in your account; come back any time.')}</p>${items}<p><a class="btn" href="account.html">${T('اذهب إلى حسابي','Go to my account')}</a></p>${help}</div>${up}`}
document.getElementById('lb').onclick=()=>{L=en()?'ar':'en';try{localStorage.setItem('x10_lang',L)}catch(e){}render()};addEventListener('hashchange',render);X10Auth.load().then(render,render);
</script></body></html>
