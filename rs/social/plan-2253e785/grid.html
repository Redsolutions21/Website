<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Instagram plan · profile grid</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14264F"><style>:root{--navy:#14264F;--red:#AF3736;--ink:#14213D;--mute:#5A6478;--bg:#EEF2F7;--line:#D9DFEA}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink)}
.lay{display:flex;gap:6px;justify-content:center;padding:8px;background:#0E1B3A}.lay a{color:#cfd8ea;text-decoration:none;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}.lay a.on{background:#fff;color:#14264F}

body{background:#fff}
.acc{display:flex;border-bottom:1px solid #dbdbdb;position:sticky;top:0;background:#fff;z-index:3}.acc button{flex:1;border:0;background:none;padding:12px;font:inherit;font-weight:700;color:#8e8e8e;border-bottom:2px solid transparent;cursor:pointer}.acc button.on{color:#000;border-color:#000}
.pf{max-width:520px;margin:0 auto;padding:14px 14px 6px;display:flex;gap:18px;align-items:center}.pf .av{width:78px;height:78px;border-radius:50%;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid #ddd;flex:0 0 auto}
.pf h2{margin:0;font-size:17px}.pf p{margin:4px 0 0;font-size:13px;color:#555}
.mode{max-width:520px;margin:0 auto;display:flex;gap:6px;padding:6px 14px 10px}.mode button{border:1px solid #dbdbdb;background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}.mode button.on{background:#000;color:#fff;border-color:#000}
.g{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.g .it{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:#eee}.g img{width:100%;height:100%;object-fit:cover;display:block}
.g .it.past::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.0)}
.g .tm{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px}
.g .ic{position:absolute;right:5px;top:4px;color:#fff;font-size:12px;text-shadow:0 0 3px rgba(0,0,0,.7)}
.g .dv{grid-column:1/-1;font-size:12px;font-weight:800;color:#333;padding:10px 4px 4px;background:#fff}
.g .now{grid-column:1/-1;font-size:12px;font-weight:800;color:#fff;background:#14264F;text-align:center;padding:6px}
#v{position:fixed;inset:0;background:rgba(8,12,24,.94);display:none;flex-direction:column;z-index:9;color:#fff}#v.on{display:flex}
#v .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}#v .top b{font-size:14px}#v .x{background:none;border:0;color:#fff;font-size:28px;cursor:pointer;line-height:1}
#v .wrap{position:relative;flex:0 0 auto;max-width:540px;width:100%;margin:0 auto}
#v .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}#v .sl::-webkit-scrollbar{display:none}
#v .sl>*{flex:0 0 100%;width:100%;aspect-ratio:4/5;object-fit:contain;scroll-snap-align:center;background:#000}
#v .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);color:#111;border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}#v .pv{left:8px}#v .nx{right:8px}
#v .dots{display:flex;justify-content:center;gap:6px;padding:10px}#v .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}#v .dots i.on{background:#fff}
#v .cap{max-width:540px;width:100%;margin:0 auto;padding:0 16px 20px;white-space:pre-wrap;font-size:14px;line-height:1.55;overflow:auto;unicode-bidi:plaintext;flex:1}
#v .meta{font-size:12px;opacity:.75;padding:0 16px 8px;max-width:540px;width:100%;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#v .meta img{width:34px;height:42px;object-fit:cover;border-radius:5px}
</style></head><body><nav class="lay"><a href="./">List</a><a href="calendar.html">Calendar</a><a href="grid.html" class=on>Profile grid</a></nav>
<div class="acc"><button class="on" data-a="red">@solutionsbyred</button><button data-a="x10">@x10academy.ai</button></div>
<div class="pf"><div class="av" id="av">RED</div><div><h2 id="nm"></h2><p id="ct"></p></div></div>
<div class="mode"><button class="on" data-m="feed">As it will look (newest on top)</button><button data-m="days">By day</button></div>
<div class="g" id="g"></div>
<div id="v" role="dialog" aria-modal="true"><div class="top"><b id="vt"></b><button class="x" aria-label="Close" onclick="closeV()">×</button></div>
<div class="wrap"><div class="sl" id="sl"></div><button class="nav pv" aria-label="Previous" onclick="go(-1)">‹</button><button class="nav nx" aria-label="Next" onclick="go(1)">›</button></div>
<div class="dots" id="dots"></div><div class="meta" id="vm"></div><div class="cap" id="vc" dir="auto"></div></div>
<script>const PC={"Launch redo":"#2FA88E","Batch 1":"#1F5BD6","Batch 2":"#7A4FD6","Batch 3 · translations":"#E08A1E"};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=[];const kw=()=>new Date(Date.now()+3*3600e3).toISOString().slice(0,16).replace('T',' ');
const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

let A='red',M='feed';
function draw(){P.forEach((p,i)=>p.i=i);const x=P.filter(p=>p.b==A).slice().reverse();const now=kw();
 document.getElementById('nm').textContent=A=='red'?'Red Solutions':'X10 Academy';document.getElementById('av').textContent=A=='red'?'RED':'X10';
 document.getElementById('ct').textContent=`${x.length} queued posts · ${x.filter(p=>p.when<=now).length} due so far`;
 let h='',last='',nowShown=false;
 for(const p of x){const d=p.when.slice(0,10);
  if(M=='days'&&d!==last){h+=`<div class="dv">${fmt(d)}</div>`;last=d}
  if(M=='feed'&&!nowShown&&p.when<=now){h+='<div class="now">▲ scheduled · already due ▼</div>';nowShown=true}
  h+=`<div class="it${p.when<=now?' past':''}" onclick="openV(${p.i})"><img src="${p.t}" loading="lazy" alt=""><span class="tm">${d.slice(8)}/${d.slice(5,7)} ${p.when.slice(11)}</span><span class="ic">${p.type=='reel'?'▶':p.m.length>1?'❐':''}</span></div>`}
 document.getElementById('g').innerHTML=h}
let cur=0;
function openV(i){const p=P[i];cur=i;const sl=document.getElementById('sl');
 sl.innerHTML=p.m.map(u=>u.endsWith('.mp4')?`<video src="${u}" poster="${p.cv||''}" controls playsinline preload="none"></video>`:`<img src="${u}" alt="slide">`).join('');
 document.getElementById('vt').textContent=`${p.b=='red'?'@solutionsbyred':'@x10academy.ai'} · ${fmt(p.when.slice(0,10))} ${p.when.slice(11)}`;
 document.getElementById('vc').textContent=p.cap;
 document.getElementById('vm').innerHTML=`<span>${p.ph} · ${p.type}</span>`+(p.pid?`<img src="${p.pt}" alt=""><span>Photo ${p.pid}${p.u>1?' (shared with its translated twin)':''}</span>`:'');
 const n=p.m.length;document.getElementById('dots').innerHTML=n>1?Array.from({length:n},(_,k)=>`<i${k?'':' class="on"'}></i>`).join(''):'';
 document.querySelectorAll('#v .nav').forEach(b=>b.style.display=n>1?'':'none');
 sl.scrollLeft=0;document.getElementById('v').classList.add('on');document.body.style.overflow='hidden'}
function closeV(){document.getElementById('v').classList.remove('on');document.body.style.overflow='';document.getElementById('sl').innerHTML=''}
function go(d){const sl=document.getElementById('sl');sl.scrollBy({left:d*sl.clientWidth,behavior:'smooth'})}
document.getElementById('sl').addEventListener('scroll',e=>{const sl=e.target;const k=Math.round(sl.scrollLeft/sl.clientWidth);document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===k))});
document.addEventListener('keydown',e=>{if(!document.getElementById('v').classList.contains('on'))return;if(e.key=='Escape')closeV();if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});

document.querySelectorAll('.acc button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.acc button').forEach(x=>x.classList.toggle('on',x===b));A=b.dataset.a;draw()});
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('on',x===b));M=b.dataset.m;draw()});
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{P=d;draw()});
</script></body></html>
