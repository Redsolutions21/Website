<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>X10 · شكراً لك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#20396F;--deep:#14264F;--steel:#5B7991;--red:#ED1C24;--ink:#14213D;--mute:#5A6478;--bg:#EEF2F7;--card:#F8FAFD;--ar:'Almarai',Tahoma,sans-serif;--en:'Lato',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);line-height:1.8}html[lang=en] body{font-family:var(--en);line-height:1.6}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:680px;margin:0 auto;padding:40px 18px 60px}
.card{background:var(--card);border-radius:24px;padding:30px 28px;margin-top:16px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.3;margin:10px 0 6px}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 10px;font-weight:700;font-size:13px}
.btn{display:inline-block;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--navy);color:#fff;text-decoration:none}.btn.red{background:var(--red)}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0}
.it b{font-size:17px}.it small{display:block;color:var(--mute)}
.up{background:linear-gradient(150deg,var(--navy),var(--steel));color:#fff}.up p{opacity:.9}
.lb{border:0;background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;float:inline-end}
p.m{color:var(--mute);font-size:14px}
</style></head><body><div class="wrap"><button class="lb" id="lb" type="button"></button><div id="v"></div></div>
<script src="auth.js"></script>
<script>
/* Set this page as the UPayments "return URL" for each link, with the matching hash:
   thanks.html#essentials · #essentials-lib · #all · #all-lib */
const LINKS={essentials:"learn/a7q2-essentials/",lib:"learn/p9x4-prompts/"};
const PAY={"lib":"","grad-all":""};
let L='ar';try{L=localStorage.getItem('x10_lang')||'ar'}catch(e){}
const en=()=>L==='en',T=(a,e)=>en()?e:a,kd=n=>en()?`KWD ${n}`:`${n} د.ك`;
function render(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';document.getElementById('lb').textContent=en()?'العربية':'English';
 const h=location.hash.replace('#',''),all=h.startsWith('all')||h==='grad-all',lib=h.endsWith('lib'),known=/^(essentials|all)(-lib)?$|^lib$|^grad-all$/.test(h),only=h==='lib',grad=h==='grad-all';
 if(!known){document.getElementById('v').innerHTML=`<div class="card"><h1>${T('معهد X10','X10 Institute')}</h1><p>${T('لم نجد طلباً مرتبطاً بهذه الصفحة. إذا أتممت الدفع ولم تصلك دورتك، راسلنا واتساب.','We could not find an order for this page. If you paid and did not get your course, message us on WhatsApp.')}</p><a class="btn" href="https://wa.me/96598985006" target="_blank" rel="noopener"><bdi dir="ltr">+965 9898 5006</bdi></a></div>`;return}
 X10Auth.demoGrant([...(only?[]:['essentials']),...(all?['all']:[]),...(lib?['lib']:[])]);
 let items=only?'':`<div class="it"><div><b>${T('أساسيات الذكاء الاصطناعي للعمل','AI Essentials for Work')}</b><small>${T('12 درساً · 4 اختبارات · شهادة','12 lessons · 4 quizzes · certificate')}</small></div><a class="btn red" href="${LINKS.essentials}">${T('ابدأ الدورة','Start the course')}</a></div>`;
 if(lib)items+=`<div class="it"><div><b>${T('مكتبة الطلبات','Prompt Library')}</b><small>${T('50 طلباً جاهزاً للعمل','50 ready prompts for work')}</small></div><a class="btn" href="${LINKS.lib}">${T('افتح المكتبة','Open the library')}</a></div>`;
 if(all)items+=`<p class="m">${T('اشتريت الوصول الكامل: سنرسل لك رابط كل دورة جديدة يوم إطلاقها على واتساب والإيميل.','You bought All-Access: we will send you each new course link the day it launches, by WhatsApp and email.')}</p>`;
 let up='';
 if(!all&&!only)up=`<div class="card up"><span class="tag">${T('عرض الترقية','Upgrade offer')}</span><h2 style="margin:10px 0 4px">${T('رقِّ طلبك إلى الوصول الكامل','Upgrade to All-Access')}</h2><p>${T('كل دورات X10 العشر بـ349 د.ك، ونخصم الـ49 د.ك التي دفعتها الآن: تدفع 300 د.ك فقط. كل دورة جديدة تفتح لك يوم إطلاقها.','All 10 X10 courses for KWD 349, minus the KWD 49 you just paid: only KWD 300. Each new course unlocks for you the day it launches.')}</p><a class="btn red" href="${PAY['grad-all']||'./#offer-all'}">${T('نعم، رقِّ طلبي','Yes, upgrade my order')} · <bdi dir="ltr">${kd(300)}</bdi></a></div>`;
 else if(!lib&&!only)up=`<div class="card up"><span class="tag">${T('إضافة سريعة','Quick add')}</span><h2 style="margin:10px 0 4px">${T('أضف مكتبة الطلبات','Add the Prompt Library')}</h2><p>${T('50 طلباً جاهزاً للعمل بالعربي والإنجليزي.','50 ready work prompts in Arabic and English.')}</p><a class="btn red" href="${PAY.lib||'https://wa.me/96598985006?text='+encodeURIComponent('X10 order: Prompt Library. Total: KWD 12')}">${T('أضفها','Add it')} · <bdi dir="ltr">${kd(12)}</bdi></a></div>`;
 document.getElementById('v').innerHTML=`<div class="card"><span class="tag">${T('تم الدفع','Payment received')}</span><h1>${T('شكراً لك! دورتك جاهزة.','Thank you! Your course is ready.')}</h1><p>${T('دوراتك محفوظة في حسابك، وترجع لها أي وقت.','Your courses are saved in your account; come back any time.')}</p>${items}<p><a class="btn" href="account.html">${T('اذهب إلى حسابي','Go to my account')}</a></p><p class="m">${T('تحتاج مساعدة؟ راسلنا واتساب:','Need help? WhatsApp us:')} <bdi dir="ltr">+965 9898 5006</bdi></p></div>${up}`}
document.getElementById('lb').onclick=()=>{L=en()?'ar':'en';try{localStorage.setItem('x10_lang',L)}catch(e){}render()};addEventListener('hashchange',render);X10Auth.load().then(render,render);
</script></body></html>
